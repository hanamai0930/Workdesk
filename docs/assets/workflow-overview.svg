<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Workdesk 工作流程</title>
  <desc id="description">Workdesk 协调连接、工作安排与记录。Chat 通过模型服务获得对话回复；独立 Work 和合作 Work 由连接的模型服务完成推理，通过官方工作端使用工具执行任务、操作文件并返回结果。Human 决定授权、处理需要的审批，并保留成果验收权。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 26px; font-weight: 600; fill: #172033; }
      .body { font-size: 18px; fill: #64748B; }
      .small { font-size: 17px; fill: #64748B; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748B; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4F7DF3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#8B7CF6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#F8FAFC"/>

  <!-- Workdesk coordinates; Human keeps authority. -->
  <rect class="card" x="40" y="44" width="1120" height="100" rx="18"/>
  <text x="64" y="87" font-size="30" font-weight="600" fill="#172033">Workdesk 协调管理</text>
  <text class="body" x="64" y="119">组织连接、工作安排、项目与记录</text>
  <rect x="858" y="64" width="278" height="60" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="997" y="89" text-anchor="middle" font-size="20" font-weight="600" fill="#16A085">Human 授权与审批</text>
  <text class="small" x="997" y="112" text-anchor="middle">确定本次范围与权限</text>

  <path class="flow" d="M 600 144 V 172 M 210 172 H 990"/>
  <path class="flow" d="M 210 172 V 200" marker-end="url(#arrow)"/>
  <path class="flow" d="M 600 172 V 200" marker-end="url(#arrow)"/>
  <path class="flow" d="M 990 172 V 200" marker-end="url(#arrow)"/>

  <!-- Three modes; Chat has a separate reply-only route. -->
  <rect class="card" x="40" y="200" width="340" height="104" rx="18"/>
  <text x="64" y="242" font-size="26" font-weight="600" fill="#4F7DF3">Chat</text>
  <text class="body" x="64" y="276">围绕消息进行对话</text>
  <rect class="card" x="430" y="200" width="340" height="104" rx="18"/>
  <text x="454" y="242" font-size="26" font-weight="600" fill="#8B7CF6">独立 Work</text>
  <text class="body" x="454" y="276">由所选模型独立推进任务</text>
  <rect class="card" x="820" y="200" width="340" height="104" rx="18"/>
  <text x="844" y="242" font-size="26" font-weight="600" fill="#8B7CF6">合作 Work</text>
  <text class="body" x="844" y="276">由 Workdesk 编排分工与交接</text>

  <path d="M 210 304 V 366" fill="none" stroke="#4F7DF3" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M 600 304 V 338 H 990 V 304" fill="none" stroke="#8B7CF6" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 795 338 V 366" fill="none" stroke="#8B7CF6" stroke-width="2" marker-end="url(#purple-arrow)"/>

  <!-- Model inference and official tools are distinct responsibilities. -->
  <rect class="card" x="40" y="366" width="340" height="128" rx="18"/>
  <text class="title" x="64" y="407">连接的模型服务</text>
  <text x="64" y="441" font-size="20" fill="#172033">API / 官方网页</text>
  <text class="small" x="64" y="473">由提供方完成模型推理</text>

  <rect class="card" x="430" y="366" width="730" height="128" rx="18"/>
  <text class="title" x="454" y="405">模型服务与官方工作端</text>
  <rect x="454" y="420" width="326" height="56" rx="10" fill="#F1F5F9"/>
  <text x="470" y="444" font-size="18" font-weight="600" fill="#172033">模型服务</text>
  <text class="small" x="470" y="466">完成模型推理</text>
  <rect x="802" y="420" width="334" height="56" rx="10" fill="#F1F5F9"/>
  <text x="818" y="444" font-size="18" font-weight="600" fill="#172033">官方工作端</text>
  <text class="small" x="818" y="466">提供工具能力与执行机制</text>

  <path d="M 210 494 V 550" fill="none" stroke="#4F7DF3" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M 795 494 V 550" fill="none" stroke="#8B7CF6" stroke-width="2" marker-end="url(#purple-arrow)"/>

  <!-- Only Work enters the file/tool execution lane. -->
  <rect class="card" x="40" y="550" width="340" height="116" rx="18"/>
  <text class="title" x="64" y="593">对话回复</text>
  <text class="body" x="64" y="630">回答与对话内容返回</text>
  <rect class="card" x="430" y="550" width="730" height="116" rx="18"/>
  <text x="454" y="592" font-size="25" font-weight="600" fill="#172033">任务执行 · 文件操作 · 结果返回</text>
  <text class="body" x="454" y="632">官方工作端使用已授权的工具</text>
  <rect x="948" y="611" width="188" height="36" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="1042" y="635" text-anchor="middle" font-size="18" font-weight="600" fill="#16A085">Human 操作审批</text>

  <path class="flow" d="M 210 666 V 700 H 795 V 666"/>
  <path class="flow" d="M 600 700 V 730" marker-end="url(#arrow)"/>

  <!-- Records and deliverables stay reviewable; Human accepts the result. -->
  <rect class="card" x="40" y="730" width="1120" height="126" rx="18"/>
  <text class="title" x="64" y="774">项目记录 · 成果保存 · 人工验收</text>
  <text class="body" x="64" y="817">Chat 留存对话记录</text>
  <text class="body" x="430" y="817">Work 留存执行记录与成果</text>
  <rect x="894" y="791" width="242" height="42" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="1015" y="819" text-anchor="middle" font-size="20" font-weight="600" fill="#16A085">Human 核对并验收</text>
</svg>
